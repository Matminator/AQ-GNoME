[project]
name = "aq-gnome"
dynamic = ["version"]
description = "Aqueous electrochemical stability screening of GNoME crystal structures"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

authors = [
  { name = "Mathias Stokkenbye Nissen", email = "matnis@dtu.com" }
]

dependencies = [
  'numpy',
  'matplotlib',
  'tqdm',
  'ase',
  'pymatgen',
  'h5py',
  'seaborn',
  'mp_api'
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_data: test requires the data/ directory to be present"]

[tool.ruff]
line-length = 100
# paper/ holds the archival notebooks behind the manuscript figures and case studies;
# they are provenance, not maintained code, so they are kept byte-for-byte and not linted.
extend-exclude = ["paper"]
force-exclude = true   # make the pre-commit hook honour the exclusion too

[tool.ruff.lint]
select = ["E", "F", "W"]   # pycodestyle errors/warnings + pyflakes
ignore = [
    "E501",   # line too long (handled by formatter if needed)
    "F401",   # imported but unused (common in __init__.py re-exports)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]   # imports-not-at-top is normal in notebook cells

[tool.setuptools_scm]

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"
